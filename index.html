<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CivilKit</title>
<meta name="description" content="All-in-one toolkit for civil engineers, architects and draughtsmen">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f5fa8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#14202e;--mut:#5c6b7d;--line:#dde3ea;--pri:#0f5fa8;--pri2:#e6f0fa;--ok:#14915a;--warn:#c27a00;--bad:#c62828;--stage:#0b1118}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141b;--card:#17202b;--ink:#e8eef5;--mut:#93a3b5;--line:#2a3644;--pri:#5aa7f0;--pri2:#1b2d42;--ok:#3ccf8a;--warn:#f0b040;--bad:#ff6b6b}}
:root[data-theme="dark"]{--bg:#0e141b;--card:#17202b;--ink:#e8eef5;--mut:#93a3b5;--line:#2a3644;--pri:#5aa7f0;--pri2:#1b2d42;--ok:#3ccf8a;--warn:#f0b040;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--pri);color:#fff}
header h1{flex:1;margin:0;font-size:18px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;width:38px;height:38px;border-radius:10px;font-size:22px;cursor:pointer}
main{max-width:900px;margin:0 auto;padding:14px 16px 40px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;margin-bottom:6px}
.cat{margin:18px 0 8px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:26px;line-height:1}
.tile b{font-size:14.5px}
.tile small{color:var(--mut);font-size:12px;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.fld em{font-style:normal;color:var(--pri)}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.res .r{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.res .r span{color:var(--mut)}
.res .r b{text-align:right}
.res .sep{margin-top:10px;font-weight:700;color:var(--pri);font-size:13px;text-transform:uppercase;letter-spacing:.03em}
.note{color:var(--mut);font-size:13px;margin-top:8px}
.info{font-size:13.5px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{padding:11px 16px;border-radius:11px;border:0;background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.big{width:100%;padding:15px;font-size:16px}
.btn:disabled{opacity:.45}
.seg{display:flex;background:var(--pri2);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font:inherit;color:var(--pri);font-weight:600;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
.stage{position:relative;width:100%;height:min(62vh,560px);background:var(--stage);border-radius:14px;overflow:hidden;touch-action:none}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .tag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;padding:6px 10px;border-radius:9px;font-size:13px}
canvas.big{width:100%;height:min(55vh,460px);display:block;background:var(--card);border-radius:14px;border:1px solid var(--line);touch-action:none}
.readout{text-align:center;margin:10px 0}
.huge{font-size:44px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1}
.sub{color:var(--mut);font-variant-numeric:tabular-nums}
.warn{color:var(--warn)} .bad{color:var(--bad)} .good{color:var(--ok)}
.hint{font-size:13px;color:var(--mut)}
details summary{cursor:pointer;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:6px 5px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}
.tscroll{overflow-x:auto}
.lv input{padding:7px;font-size:15px;min-width:64px}
.lv td{padding:3px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--bg);border-radius:10px;padding:8px 10px}
.kv small{display:block;color:var(--mut);font-size:12px}
.kv b{font-size:18px;font-variant-numeric:tabular-nums}
#arOverlay{position:fixed;inset:0;z-index:100}
#arOverlay[hidden]{display:none}
#arCv{position:absolute;inset:0;width:100%;height:100%}
#arTop{position:absolute;left:0;right:0;top:0;padding:14px;padding-top:max(14px,env(safe-area-inset-top));text-align:center;color:#fff;text-shadow:0 1px 3px #000;font:600 16px system-ui}
#arTop .big{font-size:30px}
#arCtrl{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
#arCtrl button{padding:12px 16px;border-radius:30px;border:0;background:rgba(0,0,0,.6);color:#fff;font:600 15px system-ui}
#arCtrl button.add{background:#0f5fa8;font-size:17px;padding:14px 22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:200;font-size:14px;max-width:90vw}
</style>
</head>
<body>
<header><button id="back" aria-label="Back" hidden>‹</button><h1 id="title">CivilKit</h1><button id="themeBtn" aria-label="Theme">☾</button></header>
<main id="app"></main>
<div id="arOverlay" hidden><canvas id="arCv"></canvas><div id="arTop"></div><div id="arCtrl"></div></div>
<script>
'use strict';
/* ================= helpers ================= */
const APP_VERSION='1.1.0';
const $=(s,r=document)=>r.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('ck_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('ck_'+k,JSON.stringify(v))}catch(e){}}};
const deg=r=>r*180/Math.PI, rad=d=>d*Math.PI/180, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ok=n=>typeof n==='number'&&isFinite(n);
function fmt(n,d=2){if(!ok(n))return '—';return Number(n).toLocaleString('en-IN',{maximumFractionDigits:d,minimumFractionDigits:0})}
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function toast(m,t=2200){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),t)}
function fitCanvas(cv){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;const w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);return{c,w:r.width,h:r.height}}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
async function shareText(title,text){try{if(navigator.share){await navigator.share({title,text});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(text);toast('Copied to clipboard')}catch(e){toast('Could not copy')}}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function fmtLen(m,u){if(!ok(m))return '—';if(u==='cm')return (m*100).toFixed(1)+' cm';if(u==='ftin'){let tin=m/0.0254,ft=Math.floor(tin/12),inch=tin-ft*12;if(inch>=11.95){ft++;inch=0}return ft+'′ '+inch.toFixed(1)+'″'}if(u==='in')return (m/0.0254).toFixed(1)+' in';return m.toFixed(2)+' m'}
const vol=m3=>`${fmt(m3,3)} m³ · ${fmt(m3*35.3147,2)} cft`;

/* ---- sensors ---- */
const needsPerm=()=>typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function';
async function askMotionPerm(){try{if(needsPerm()){const r=await DeviceMotionEvent.requestPermission();if(r!=='granted')return false}if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){await DeviceOrientationEvent.requestPermission()}return true}catch(e){return false}}
function screenAngle(){return (screen.orientation&&screen.orientation.angle)||window.orientation||0}
/* gravity in SCREEN coords: x right, y up, z out of screen (reaction to gravity: points "up") */
function gravity(cb,k=0.18){let got=false;const f={x:0,y:0,z:9.81};let first=true;
 const hnd=e=>{const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;got=true;const s=IOS?-1:1;const kk=first?1:k;first=false;
  f.x+=(s*a.x-f.x)*kk;f.y+=(s*a.y-f.y)*kk;f.z+=(s*a.z-f.z)*kk;
  const th=rad(screenAngle());const sx=f.x*Math.cos(th)-f.y*Math.sin(th),sy=f.x*Math.sin(th)+f.y*Math.cos(th);
  cb({x:sx,y:sy,z:f.z,n:Math.hypot(f.x,f.y,f.z)})};
 window.addEventListener('devicemotion',hnd);return{stop:()=>window.removeEventListener('devicemotion',hnd),got:()=>got}}
/* show start button where iOS needs permission; else start right away. startFn returns a stop fn */
function sensorGate(box,startFn,noSensorMsg){let stop=null,timer=null,g=null;
 const run=async()=>{if(needsPerm()&&!(await askMotionPerm())){box.innerHTML='<p class="bad">Motion sensor permission was denied.</p>';return}box.innerHTML='';const r=startFn();stop=r.stop;g=r.got;
  timer=setTimeout(()=>{if(g&&!g())box.innerHTML='<p class="warn">'+(noSensorMsg||'No motion sensor found. Open this tool on a phone or tablet.')+'</p>'},2500)};
 const showBtn=()=>{box.innerHTML='<button class="btn big">Start sensors</button>';box.firstChild.onclick=run};
 if(needsPerm()){Promise.resolve().then(()=>DeviceMotionEvent.requestPermission()).then(r=>{if(r==='granted')run();else showBtn()}).catch(showBtn)}else run();
 return()=>{clearTimeout(timer);stop&&stop()}}
async function openCamera(video){const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.setAttribute('playsinline','');video.muted=true;video.srcObject=s;try{await video.play()}catch(e){}return s}
const stopStream=s=>{if(s)s.getTracks().forEach(t=>t.stop())};
function camErr(e){return e&&e.name==='NotAllowedError'?'Camera permission denied. Allow camera in browser settings.':(location.protocol!=='https:'&&location.hostname!=='localhost'?'Camera needs HTTPS (e.g. GitHub Pages link).':'Camera not available: '+(e&&e.message||e))}

/* ================= calculator builder ================= */
const LU=[['m','Metre (m)'],['ft','Feet (ft)']];
const lf=v=>v.u==='ft'?0.3048:1, ul=v=>v.u==='ft'?'ft':'m', ua=v=>v.u==='ft'?'ft²':'m²';
const MIXES=[['1:3:6','M10 (1:3:6)'],['1:2:4','M15 (1:2:4)'],['1:1.5:3','M20 (1:1.5:3)'],['1:1:2','M25 (1:1:2)*'],['1:4:8','M7.5 (1:4:8)'],['1:5:10','M5 (1:5:10)']];
function calcTool(spec){return el=>{
 const key='calc_'+spec.id,saved=store.get(key,{}),v={};
 spec.fields.forEach(f=>v[f.k]=saved[f.k]!==undefined&&saved[f.k]!==null?saved[f.k]:f.def);
 el.innerHTML=`<div class="card"><div class="form"></div></div><div class="card"><h3>Result</h3><div class="res"></div><div class="note"></div><div class="row"><button class="btn share">Share / Copy</button><button class="btn ghost reset">Reset inputs</button></div></div>${spec.info?`<details class="card"><summary>Method &amp; formula</summary><div class="info">${spec.info}</div></details>`:''}`;
 const form=$('.form',el),res=$('.res',el),note=$('.note',el);let text='';
 form.innerHTML=spec.fields.map(f=>{const inp=f.type==='sel'?`<select data-k="${f.k}">${f.opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`:`<input data-k="${f.k}" type="number" inputmode="decimal" step="any">`;return `<label class="fld" data-k="${f.k}"><span>${f.label} <em></em></span>${inp}</label>`}).join('');
 const upd=()=>{spec.fields.forEach(f=>{const lab=$(`label[data-k="${f.k}"]`,form);lab.style.display=(!f.when||f.when(v))?'':'none';$('em',lab).textContent=f.unit?(typeof f.unit==='function'?f.unit(v):f.unit):''});
  let out;try{out=spec.calc(v)}catch(e){out=[['Error',e.message]]}if(Array.isArray(out))out={rows:out};
  res.innerHTML=out.rows.map(r=>r[0]==='#'?`<div class="sep">${r[1]}</div>`:`<div class="r"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
  note.innerHTML=out.note||'';store.set(key,v);
  text=spec.name+'\n'+spec.fields.filter(f=>!f.when||f.when(v)).map(f=>{let val=v[f.k];if(f.type==='sel'){const o=f.opts.find(o=>o[0]==val);val=o?o[1]:val}return f.label+': '+val+(f.unit?' '+(typeof f.unit==='function'?f.unit(v):f.unit):'')}).join('\n')+'\n--\n'+out.rows.map(r=>r[0]==='#'?'['+r[1]+']':r[0]+': '+String(r[1]).replace(/<[^>]+>/g,'')).join('\n')+'\n(CivilKit)'};
 spec.fields.forEach(f=>{const i=$(`[data-k="${f.k}"]`,form);i.value=v[f.k];i.addEventListener('input',()=>{v[f.k]=f.type==='sel'?i.value:(i.value===''?NaN:parseFloat(i.value));upd()})});
 $('.share',el).onclick=()=>shareText(spec.name,text);
 $('.reset',el).onclick=()=>{spec.fields.forEach(f=>{v[f.k]=f.def;$(`[data-k="${f.k}"]`,form).value=f.def});upd()};
 upd()}}
const mixParts=m=>m.split(':').map(Number);
const chk=(c,t)=>c?`<span class="good">✓ ${t}</span>`:`<span class="warn">⚠ ${t}</span>`;

/* ================= TOOL: AR TAPE ================= */
function arTool(el){
 el.innerHTML=`<div class="card"><h3>AR Tape Measure</h3><p class="hint">Measures real distances in 3D using your phone's camera + motion tracking (Google ARCore / WebXR). Works in Chrome on ARCore-supported Android phones.</p>
 <div id="arStat" class="note">Checking AR support…</div><button id="arGo" class="btn big" disabled>Start AR measuring</button></div>
 <div class="card"><h3>How to use</h3><ol class="hint"><li>Tap Start, then slowly move the phone so it can detect the floor/wall (dots/circle appear).</li><li>Point the centre ring at the first corner and tap <b>＋ Point</b>.</li><li>Move to the next corner and tap again. Each segment length and the total are shown.</li><li><b>New line</b> starts a separate measurement. Good light and textured surfaces give best accuracy (typically ±1–2 cm per metre).</li></ol></div>
 <div class="card" id="arLog" hidden><h3>Last session</h3><div class="res"></div><div class="row"><button class="btn share">Share / Copy</button></div></div>
 <div class="card"><h3>No AR on your phone?</h3><p class="hint">Use <b>Camera Distance &amp; Height</b> (works on every phone using tilt angle + your holding height).</p><button class="btn ghost" onclick="location.hash='camdist'">Open Camera Distance &amp; Height</button></div>`;
 const stat=$('#arStat',el),go=$('#arGo',el);let sess=null,lastText='';
 (async()=>{try{if(navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar')){stat.innerHTML='<span class="good">✓ AR is supported on this device.</span>';go.disabled=false}else stat.innerHTML='<span class="warn">AR (WebXR) is not supported in this browser/device. Use Chrome on an ARCore-supported Android phone, opened from an HTTPS link.</span>'}catch(e){stat.textContent='AR check failed: '+e.message}})();
 go.onclick=async()=>{try{sess=await startAR(lines=>{const log=$('#arLog',el);const rs=[];let txt='AR measurements\n';lines.forEach((L,i)=>{if(L.length<2)return;let tot=0;for(let j=1;j<L.length;j++)tot+=dist3(L[j-1],L[j]);rs.push(['Line '+(i+1)+' ('+(L.length-1)+' seg)',fmtLen(tot,'m')+' · '+fmtLen(tot,'ftin')]);txt+='Line '+(i+1)+': '+fmtLen(tot,'m')+' ('+fmtLen(tot,'ftin')+')\n'});if(rs.length){log.hidden=false;$('.res',log).innerHTML=rs.map(r=>`<div class="r"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');lastText=txt}})}catch(e){stat.innerHTML='<span class="bad">Could not start AR: '+e.message+'</span>'}};
 $('#arLog .share',el).onclick=()=>shareText('AR measurements',lastText);
 return()=>{if(sess)try{sess.end()}catch(e){}}}
const dist3=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);
function project(p,P,V,W,H){const x=p.x,y=p.y,z=p.z;
 const vx=V[0]*x+V[4]*y+V[8]*z+V[12],vy=V[1]*x+V[5]*y+V[9]*z+V[13],vz=V[2]*x+V[6]*y+V[10]*z+V[14],vw=V[3]*x+V[7]*y+V[11]*z+V[15];
 const cx=P[0]*vx+P[4]*vy+P[8]*vz+P[12]*vw,cy=P[1]*vx+P[5]*vy+P[9]*vz+P[13]*vw,cw=P[3]*vx+P[7]*vy+P[11]*vz+P[15]*vw;
 if(cw<=1e-4)return null;return{x:(cx/cw+1)/2*W,y:(1-cy/cw)/2*H}}
async function startAR(onEnd){
 const ov=$('#arOverlay'),cv=$('#arCv'),top=$('#arTop'),ctrl=$('#arCtrl');ov.hidden=false;
 const units=['m','cm','ftin','in'];let ui=0;
 ctrl.innerHTML='<button data-a="undo">Undo</button><button data-a="new">New line</button><button class="add" data-a="add">＋ Point</button><button data-a="unit">Unit</button><button data-a="exit">Exit</button>';
 let session;
 try{session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test','local'],optionalFeatures:['dom-overlay'],domOverlay:{root:ov}})}catch(e){ov.hidden=true;throw e}
 const glc=document.createElement('canvas');const gl=glc.getContext('webgl',{xrCompatible:true,alpha:true});
 if(gl.makeXRCompatible)await gl.makeXRCompatible();
 session.updateRenderState({baseLayer:new XRWebGLLayer(session,gl)});
 const local=await session.requestReferenceSpace('local'),viewer=await session.requestReferenceSpace('viewer');
 const hts=await session.requestHitTestSource({space:viewer});
 const lines=[[]];let ret=null;
 const add=()=>{if(ret){lines[lines.length-1].push({x:ret.x,y:ret.y,z:ret.z});if(navigator.vibrate)navigator.vibrate(20)}};
 ctrl.addEventListener('beforexrselect',e=>e.preventDefault());
 ctrl.onclick=e=>{const a=e.target.dataset.a;if(!a)return;if(a==='add')add();else if(a==='undo'){const L=lines[lines.length-1];if(L.length)L.pop();else if(lines.length>1)lines.pop()}else if(a==='new'){if(lines[lines.length-1].length)lines.push([])}else if(a==='unit')ui=(ui+1)%units.length;else if(a==='exit')session.end()};
 session.addEventListener('select',add);
 session.addEventListener('end',()=>{ov.hidden=true;ctrl.onclick=null;try{hts.cancel()}catch(e){}onEnd&&onEnd(lines)});
 const onFrame=(t,frame)=>{session.requestAnimationFrame(onFrame);
  const layer=session.renderState.baseLayer;gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  const pose=frame.getViewerPose(local);const {c,w,h}=fitCanvas(cv);c.clearRect(0,0,w,h);
  if(!pose){top.innerHTML='Move phone slowly to start tracking…';return}
  const view=pose.views[0],P=view.projectionMatrix,V=view.transform.inverse.matrix;
  const hits=frame.getHitTestResults(hts);ret=hits.length?hits[0].getPose(local).transform.position:null;
  const u=units[ui],pr=p=>project(p,P,V,w,h);
  c.lineWidth=3;c.font='600 15px system-ui';c.textAlign='center';c.textBaseline='middle';
  const label=(a,b,txt)=>{if(!a||!b)return;const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const tw=c.measureText(txt).width+14;c.fillStyle='rgba(0,0,0,.7)';c.beginPath();c.roundRect?c.roundRect(mx-tw/2,my-13,tw,26,13):c.rect(mx-tw/2,my-13,tw,26);c.fill();c.fillStyle='#fff';c.fillText(txt,mx,my)};
  lines.forEach((L,li)=>{const cur=li===lines.length-1;for(let j=0;j<L.length;j++){const s=pr(L[j]);if(s){c.fillStyle='#fff';c.beginPath();c.arc(s.x,s.y,7,0,7);c.fill();c.fillStyle='#0f5fa8';c.beginPath();c.arc(s.x,s.y,4,0,7);c.fill()}
   if(j>0){const a=pr(L[j-1]);if(a&&s){c.strokeStyle=cur?'#ffd400':'#7fd1ff';c.beginPath();c.moveTo(a.x,a.y);c.lineTo(s.x,s.y);c.stroke();label(a,s,fmtLen(dist3(L[j-1],L[j]),u))}}}});

/* ================= ORIENTATION HELPERS ================= */
function orientGate(box,startFn,msg){let stop=null,timer=null,g=null;

 const deny=()=>{box.innerHTML='<p class="bad">Sensor permission denied.</p>'};

 const showBtn=()=>{box.innerHTML='<button class="btn big">Start sensors</button>';box.firstChild.onclick=run};

/* magnetic heading of phone top (0..360, clockwise from magnetic north) */
function magHeading(cb){let got=false,hd=null;const ev='ondeviceorientationabsolute' in window?'deviceorientationabsolute':'deviceorientation';

  if(hd==null)hd=x;else{const d=((x-hd+540)%360)-180;hd=(hd+d*0.2+360)%360}cb(hd,e)};
 window.addEventListener(ev,h);return{stop:()=>window.removeEventListener(ev,h),got:()=>got}}
/* gyro (relative) yaw – not affected by steel/magnets. Calls cb(alpha, beta, gamma) */
function gyroYaw(cb){let got=false,a=null;const h=e=>{if(e.alpha==null)return;got=true;if(a==null)a=e.alpha;else{const d=((e.alpha-a+540)%360)-180;a=(a+d*0.35+360)%360}cb(a,e.beta||0,e.gamma||0)};
 window.addEventListener('deviceorientation',h);return{stop:()=>window.removeEventListener('deviceorientation',h),got:()=>got}}
const wrap180=x=>((x%360)+540)%360-180;
/* Sun position (NOAA-style approximation, ~0.1° accuracy). Returns azimuth (clockwise from TRUE north) & altitude in degrees */
function sunPos(date,lat,lon){const n=date.getTime()/86400000+2440587.5-2451545.0;
 const L=(280.460+0.9856474*n)%360,g=rad((357.528+0.9856003*n)%360);const lam=rad(L+1.915*Math.sin(g)+0.020*Math.sin(2*g));const eps=rad(23.439-0.0000004*n);
 const ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)),dec=Math.asin(Math.sin(eps)*Math.sin(lam));
 const gmst=((18.697374558+24.06570982441908*n)%24+24)%24;const H=rad(gmst*15+lon)-ra,phi=rad(lat);
 const alt=Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H));
 const az=Math.atan2(-Math.cos(dec)*Math.sin(H),Math.sin(dec)*Math.cos(phi)-Math.cos(dec)*Math.cos(H)*Math.sin(phi));

 info:'Typical swell: sand 10–15%, ordinary soil 20–30%, clay 30–40%, rock 50–60%.'},
{id:'slope',name:'Slope / Gradient Converter',icon:'📉',desc:'Degrees ⇄ % ⇄ 1 in n ⇄ rise/run',fields:[
 {k:'m',label:'Input type',type:'sel',def:'deg',opts:[['deg','Angle (degrees)'],['pct','Gradient (%)'],['ratio','1 in n'],['rr','Rise & run']]},
 {k:'a',label:'Angle',def:30,unit:'°',when:v=>v.m==='deg'},{k:'p',label:'Gradient',def:2,unit:'%',when:v=>v.m==='pct'},{k:'n',label:'n (1 in n)',def:12,when:v=>v.m==='ratio'},{k:'rise',label:'Rise',def:1,when:v=>v.m==='rr'},{k:'run',label:'Run',def:4,when:v=>v.m==='rr'}],
 calc:v=>{let t;switch(v.m){case'deg':t=Math.tan(rad(v.a));break;case'pct':t=v.p/100;break;case'ratio':t=1/v.n;break;default:t=v.rise/v.run}const a=deg(Math.atan(t));return[['Angle',fmt(a,3)+'°'],['Gradient',fmt(t*100,3)+' %'],['1 in n',t?'1 in '+fmt(1/t,2):'—'],['Rise per metre',fmt(t*1000,1)+' mm'],['Rise per foot',fmt(t*12,3)+' inch'],['Roof pitch',fmt(t*12,2)+' : 12'],['Slope length per 1 m run',fmt(Math.hypot(1,t),4)+' m']]},
 info:'Typical: drains 1 in 100–200; ramps max 1 in 12 (wheelchair); roads camber 1 in 40–60; RCC roof 1 in 100.'},
{id:'beam',name:'Beam Quick Check',icon:'📏',desc:'Reactions, moment, shear, deflection',fields:[
 {k:'sup',label:'Support',type:'sel',def:'ss',opts:[['ss','Simply supported'],['cant','Cantilever'],['fix','Fixed both ends']]},{k:'L',label:'Span',def:4,unit:'m'},{k:'w',label:'UDL (incl. self weight)',def:15,unit:'kN/m'},{k:'P',label:'Point load (mid-span / free end)',def:0,unit:'kN'},
 {k:'b',label:'Width b',def:230,unit:'mm'},{k:'D',label:'Depth D',def:450,unit:'mm'},{k:'E',label:'Elastic modulus E',def:25,unit:'GPa'}],
 calc:v=>{const L=v.L,w=v.w||0,P=v.P||0,I=v.b*Math.pow(v.D,3)/12,E=v.E*1000,Lm=L*1000;let R,V,M,dl;
  if(v.sup==='ss'){R=w*L/2+P/2;V=R;M=w*L*L/8+P*L/4;dl=5*w*Math.pow(Lm,4)/(384*E*I)+P*1000*Math.pow(Lm,3)/(48*E*I)}
  else if(v.sup==='cant'){R=w*L+P;V=R;M=w*L*L/2+P*L;dl=w*Math.pow(Lm,4)/(8*E*I)+P*1000*Math.pow(Lm,3)/(3*E*I)}
  else{R=w*L/2+P/2;V=R;M=w*L*L/12+P*L/8;dl=w*Math.pow(Lm,4)/(384*E*I)+P*1000*Math.pow(Lm,3)/(192*E*I)}
  const Z=v.b*v.D*v.D/6,sig=M*1e6/Z;const lim=v.sup==='cant'?Lm/125:Lm/250;
  return{rows:[['Support reaction (each/fixed end)',fmt(R,2)+' kN'],['Max. shear force',fmt(V,2)+' kN'],['Max. bending moment',fmt(M,2)+' kN·m'],['Moment of inertia I',fmt(I/1e6,1)+' ×10⁶ mm⁴'],['Bending stress M/Z',fmt(sig,2)+' N/mm²'],['Max. deflection (gross section)',fmt(dl,2)+' mm'],['Limit span/250 (cantilever /125)',chk(dl<=lim,fmt(lim,1)+' mm')]],note:'Elastic analysis for quick checks only. RCC design must follow IS 456 (limit state, cracked section, long-term deflection).'}},
 info:'SS: M = wL²/8 + PL/4, δ = 5wL⁴/384EI + PL³/48EI. Cantilever: M = wL²/2 + PL, δ = wL⁴/8EI + PL³/3EI. Fixed: M = wL²/12 + PL/8, δ = wL⁴/384EI + PL³/192EI. Concrete E = 5000√fck MPa (M25 = 25 GPa).'},
{id:'tank',name:'Water Tank & Sump',icon:'💧',desc:'Capacity and requirement',fields:[
 {k:'sh',label:'Shape',type:'sel',def:'rect',opts:[['rect','Rectangular'],['cyl','Cylindrical']]},{k:'u',label:'Unit',type:'sel',def:'ft',opts:LU},
 {k:'L',label:'Length',def:8,unit:ul,when:v=>v.sh==='rect'},{k:'B',label:'Width',def:6,unit:ul,when:v=>v.sh==='rect'},{k:'dia',label:'Diameter',def:6,unit:ul,when:v=>v.sh==='cyl'},{k:'H',label:'Water depth',def:5,unit:ul},
 {k:'p',label:'Persons',def:5},{k:'lpcd',label:'Water per person per day',def:135,unit:'L'},{k:'days',label:'Storage days',def:1}],
 calc:v=>{const f=lf(v);const V=(v.sh==='rect'?v.L*v.B:Math.PI/4*v.dia*v.dia)*v.H*f*f*f;const need=v.p*v.lpcd*v.days;return[['Tank capacity',fmt(V*1000,0)+' litres'],['',vol(V)],['Required storage',fmt(need,0)+' litres'],['Status',chk(V*1000>=need,V*1000>=need?'Sufficient':'Short by '+fmt(need-V*1000,0)+' L')]]},
 info:'1 m³ = 1000 L; 1 cft = 28.317 L. IS 1172: 135 LPCD for residences with full flushing. Keep 150–300 mm free board above water depth.'},
{id:'cost',name:'House Construction Cost',icon:'💰',desc:'Thumb-rule cost & material estimate',fields:[
 {k:'A',label:'Built-up area',def:1000,unit:'ft²'},{k:'r',label:'Construction rate',def:1800,unit:'₹/ft²'}],
 calc:v=>{const T=v.A*v.r;const br=[['Cement',16.4],['Sand',12.3],['Aggregate',7.4],['Steel',24.6],['Paint',4.1],['Bricks',4.4],['Tiles / flooring',8],['Windows',3],['Doors',3.4],['Plumbing',5.5],['Electrical',6.8],['Sanitary',4.1]];
  return{rows:[['Total estimated cost','₹ '+fmt(T,0)],['#','Cost split (thumb rule)']].concat(br.map(b=>[b[0]+' ('+b[1]+'%)','₹ '+fmt(T*b[1]/100,0)])).concat([['#','Approx. materials'],['Cement',fmt(v.A*0.4,0)+' bags'],['Sand',fmt(v.A*1.816,0)+' cft'],['Aggregate',fmt(v.A*1.35,0)+' cft'],['Steel',fmt(v.A*4/1000,2)+' tonne'],['Bricks',fmt(v.A*8,0)+' nos'],['Paint',fmt(v.A*0.18,0)+' litres'],['Flooring tiles',fmt(v.A*1.3,0)+' ft²']]),note:'Widely used Indian thumb rules for a G+0/G+1 RCC frame house. Labour is included in the rate. Actual quantities come from a detailed estimate (BOQ).'}}}

/* ================= REGISTRY & ROUTER ================= */
const CATS=[['m','Measure with camera & sensors'],['q','Quantity calculators'],['d','Design & survey'],['r','Converters & reference']];
const TOOLS=[
 {id:'north',cat:'m',icon:'⬆️',name:'North Finder',desc:'Compass + true north by sun & shadow',render:northTool},
 {id:'rightangle',cat:'m',icon:'⟂',name:'Wall 90° Marking',desc:'3-4-5 tape method + phone guide',render:rightAngleTool},
 {id:'ar',cat:'m',icon:'📱',name:'AR Tape Measure',desc:'Real 3D distances using camera',render:arTool},
 {id:'camdist',cat:'m',icon:'🎯',name:'Camera Distance & Height',desc:'Distance & height of buildings, poles, trees',render:camDistTool},
 {id:'protractor',cat:'m',icon:'📐',name:'Virtual Protractor',desc:'Measure angles on camera view',render:protractorTool},
 {id:'level',cat:'m',icon:'🟢',name:'Spirit Level & Plumb',desc:'Bubble level, edge level, plumb',render:levelTool},
 {id:'clino',cat:'m',icon:'⛰️',name:'Clinometer / Slope',desc:'Angle, gradient %, 1 in n',render:clinoTool},
 {id:'compass',cat:'m',icon:'🧭',name:'Compass & Bearing',desc:'Plot facing, bearing between lines',render:compassTool},
 {id:'ruler',cat:'m',icon:'📏',name:'Screen Ruler',desc:'Calibrated mm & inch ruler',render:rulerTool},
 {id:'gps',cat:'m',icon:'🗺️',name:'GPS Plot Area',desc:'Walk the boundary → area in acre, gunta…',render:gpsTool},
 {id:'sound',cat:'m',icon:'🔊',name:'Sound Level Meter',desc:'Site noise in dB',render:soundTool},
 {id:'torch',cat:'m',icon:'🔦',name:'Torch',desc:'Flash light for inspection',render:torchTool},
 ...CALCS.filter(c=>['concrete','brick','plaster','steel','tiles','paint','excav','cost'].includes(c.id)).map(c=>({id:c.id,cat:'q',icon:c.icon,name:c.name,desc:c.desc,render:calcTool(c)})),
 ...CALCS.filter(c=>['stair','beam','stirrup','area','tank','slope'].includes(c.id)).map(c=>({id:c.id,cat:'d',icon:c.icon,name:c.name,desc:c.desc,render:calcTool(c)})),
 {id:'levelbook',cat:'d',icon:'📊',name:'Levelling Field Book',desc:'HI method RLs + arithmetic check',render:levelBookTool},
 {id:'units',cat:'r',icon:'🔁',name:'Unit Converter',desc:'Length, area (gunta, cent), brass, stress…',render:unitTool},

 {id:'about',cat:'r',icon:'ℹ️',name:'About & Updates',desc:'Install, update, accuracy notes',render:aboutTool}];
const app=$('#app'),titleEl=$('#title'),backBtn=$('#back');let cleanup=null;
function renderHome(){app.innerHTML=`<input class="search" id="q" type="search" placeholder="Search ${TOOLS.length} tools…"><div id="list"></div>`;const list=$('#list');
 const draw=q=>{q=(q||'').toLowerCase();list.innerHTML=CATS.map(([k,n])=>{const ts=TOOLS.filter(t=>t.cat===k&&(!q||(t.name+' '+t.desc).toLowerCase().includes(q)));return ts.length?`<div class="cat">${n}</div><div class="grid">${ts.map(t=>`<button class="tile" data-id="${t.id}"><span class="ic">${t.icon}</span><b>${t.name}</b><small>${t.desc}</small></button>`).join('')}</div>`:''}).join('')||'<p class="hint">No tool found.</p>'};
 draw();$('#q').oninput=e=>draw(e.target.value);list.onclick=e=>{const b=e.target.closest('.tile');if(b)location.hash=b.dataset.id}}
function route(){if(cleanup){try{cleanup()}catch(e){}cleanup=null}const id=location.hash.slice(1);const t=TOOLS.find(x=>x.id===id);app.innerHTML='';
 if(!t){titleEl.textContent='CivilKit';backBtn.hidden=true;renderHome()}else{titleEl.textContent=t.name;backBtn.hidden=false;const r=t.render(app);cleanup=typeof r==='function'?r:null}window.scrollTo(0,0)}
backBtn.onclick=()=>{if(history.length>1&&location.hash)history.back();else location.hash=''};

/* theme */
const applyTheme=t=>{if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme};applyTheme(store.get('theme',''));
$('#themeBtn').onclick=()=>{const cur=store.get('theme','');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;const n=dark?'light':'dark';store.set('theme',n);applyTheme(n)};
/* install & service worker */
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__installEvt=e});
let hadCtl=false,reloading=false;
if('serviceWorker' in navigator&&location.protocol!=='file:'){hadCtl=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl&&!reloading){reloading=true;location.reload()}})}
async function checkUpdate(msg){if(!('serviceWorker' in navigator)){msg.textContent='Offline mode not supported in this browser.';return}msg.textContent='Checking…';try{const reg=await navigator.serviceWorker.getRegistration();if(!reg){msg.textContent='Offline mode not active yet (open from the web link).';return}await reg.update();
 const w=reg.waiting||reg.installing;if(!w){msg.textContent='✓ You have the latest version ('+APP_VERSION+').';return}msg.textContent='Updating…';hadCtl=true;const go=sw=>sw.postMessage('skip');if(reg.waiting)go(reg.waiting);else w.addEventListener('statechange',()=>{if(w.state==='installed')go(w)})}catch(e){msg.textContent='Could not check (are you offline?)'}}
route();
